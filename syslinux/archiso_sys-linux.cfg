LABEL tivarch
TEXT HELP
Boot the TiVarch live installer medium on BIOS.
ENDTEXT
MENU LABEL TiVarch Installer (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-lts
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=TIVARCH copytoram=n cow_spacesize=4G quiet loglevel=3


LABEL archspeech
TEXT HELP
Boot the TiVarch install medium on BIOS with speakup screen reader.
ENDTEXT
MENU LABEL TiVarch Installer with speech (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=TIVARCH accessibility=on copytoram=n cow_spacesize=4G quiet loglevel=3
